<body>
<div id="mappa"></div>

<div id="extra"></div>

<script>
(function () {
"use strict";
const { $, tutti, esc, euro, hhmm } = ALP;
let HUB = ALP.ls.get('hub_nome');
let CONS = [], RIDER = [], POS = {}, VERS = [], TURNI = [], GIRI = [], KM = [], SEG = {}, map = null, livello = null, primaVolta = true;
let VISTA = 'mappa', SERV = ALP.servizio(), SELE = null, Q = { p: 4, b: 0, tipo: 'DOMICILIO', paese: "San Paolo d'Argon" };
const MAX = 20, GIALLO = 15, STRADA_DEF = 10;

/* ---------- accesso con PIN (solo qui si chiama lo script Google) ---------- */
function login() {
  $('#ui').innerHTML = `<div class="pinbox vetro"><div style="background:var(--lime);border-radius:22px;padding:14px 18px"><img src="../img/logo.png" alt="Amo la Pizza" style="width:150px;display:block"></div><b style="font-size:20px">Centrale consegne</b>
    <input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="PIN"><button class="btn p" id="ok">Entra</button></div>`;
  const go = async () => {
    ALP.toast('Entro…');
    try { const r = await ALP.pin('hubDati', $('#p').value); HUB = r.chi || 'Cassa'; ALP.ls.set('hub_nome', HUB); avvia(); }
    catch (e) { ALP.toast(/PIN/.test(String(e.message)) ? 'PIN non valido' : String(e.message || e), 1); }
  };
  $('#ok').onclick = go; $('#p').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#p').focus();
}

/* ---------- dati in tempo reale ---------- */
let stop = [];
async function avvia() {
  stop.forEach(f => { try { f(); } catch (e) {} }); stop = [];
  const a = await FB.leggi('accessi/' + await FB.uid()).catch(() => null);
  if (!a || a.ruolo !== 'hub') { ALP.ls.del('hub_nome'); return login(); }
  struttura();
  const oggi = ALP.oggi(), L = async p => stop.push(await p);
  let noteLibere = null;
  L(FB.lista('consegne', [['data', '==', oggi]], d => { CONS = d; geocodificaMancanti(); presto(); }));
  L(FB.lista('rider', [], d => {
    const liberi = new Set(d.filter(r => r.stato === 'pizzeria' && r.turno).map(r => r.nome));
    if (noteLibere) liberi.forEach(n => { if (!noteLibere.has(n)) { ALP.suono(); ALP.toast(n + ' è libero in pizzeria'); } });
    noteLibere = liberi; RIDER = d; presto();
  }));
  L(FB.lista('posizioni', [], d => { POS = {}; d.forEach(p => POS[p.id] = p); presto(); }));
  L(FB.lista('versamenti', [['data', '==', oggi]], d => { if (d.some(v => v.stato === 'attesa' && !VERS.find(x => x.id === v.id))) ALP.suono(true); VERS = d; presto(); }));
  L(FB.lista('turni', [['data', '==', oggi]], d => { TURNI = d; presto(); }));
  L(FB.lista('giri', [['data', '==', oggi]], d => { GIRI = d; presto(); }));
  L(FB.lista('km', [], d => { KM = d; }));
  L(FB.doc('segreti/app', d => { SEG = d || {}; }));
  setInterval(presto, 20000);
}
let rid = 0; function presto() { if (!rid) rid = requestAnimationFrame(() => { rid = 0; disegna(); }); }

/** indirizzi ancora senza coordinate: li cerca la centrale (una volta sola per consegna) */
const cercati = new Set();
function geocodificaMancanti() {
  CONS.filter(c => !c.lat && c.via && c.tipo !== 'ASPORTO' && c.stato !== 'annullata' && !cercati.has(c.id + c.via + c.paese)).forEach(async c => {
    cercati.add(c.id + c.via + c.paese);
    const p = await ALP.geocodifica(c.via, c.paese);
    if (!p) return ALP.toast('Non trovo sulla mappa: ' + c.via + ', ' + c.paese, 1);
    const min = ALP.minuti(ALP.CASA, p);
    FB.cambia('consegne/' + c.id, { lat: p[0], lng: p[1], lontano: min > LONTANO ? min : 0, agg: Date.now() }).catch(() => {});
    if (min > LONTANO) controllaLontano(Object.assign({}, c, { lontano: min }));
  });
}

/** indirizzo a più di 20 minuti: probabilmente paese sbagliato → conferma o correzione */
const LONTANO = 20;
function controllaLontano(c) {
  ALP.suono(true);
  if (confirm('Attenzione: ' + c.via + ', ' + c.paese + ' risulta a circa ' + c.lontano + ' minuti dalla pizzeria.\n\nOK = l\'indirizzo è giusto\nAnnulla = lo correggo')) FB.cambia('consegne/' + c.id, { lontanoOk: true, agg: Date.now() });
  else schedaConsegna(CONS.find(x => x.id === c.id) || c);
}

/* ---------- calcoli istantanei per ogni rider ---------- */
const inServizio = () => RIDER.filter(r => r.turno && r.stato && r.stato !== 'fuori' && TURNI.some(t => t.id === r.turno && !t.fine));
const daAssegnare = () => CONS.filter(c => c.tipo !== 'ASPORTO' && !c.rider && c.stato !== 'annullata' && c.stato !== 'consegnata').sort((a, b) => (a.previsto || '99').localeCompare(b.previsto || '99'));
const posFresca = r => { const p = POS[r.nome]; return p && r.giro && p.giro === r.giro && Date.now() - new Date(p.ora).getTime() < 3 * 60000 ? p : null; };
function info(r) {
  const n = r.nome, ora = Date.now();
  const pend = CONS.filter(c => c.rider === n && c.stato !== 'consegnata' && c.stato !== 'annullata');
  const ultima = CONS.filter(c => c.rider === n && c.stato === 'consegnata' && c.giro && c.giro === r.giro && c.lat).sort((a, b) => b.consegnata - a.consegnata)[0];
  const p = posFresca(r), qui = p ? [p.lat, p.lng] : (ultima ? [ultima.lat, ultima.lng] : ALP.CASA);
  const o = { r, n, colore: ALP.colore(n), pend, pos: p, qui };
  if (r.giro && pend.length) { o.stato = 'andata'; o.seq = ALP.ordina(qui, pend); Object.assign(o, ALP.eta(qui, ora, o.seq)); }
  else if (r.giro) { o.stato = 'rientro'; o.seq = []; o.tappe = {}; o.rientro = ora + ALP.minuti(qui, ALP.CASA) * 60000; }
  else { o.stato = 'pizzeria'; o.seq = ALP.ordina(ALP.CASA, pend); Object.assign(o, ALP.eta(ALP.CASA, ora + 2 * 60000, o.seq)); if (!pend.length) o.rientro = null; }
  o.ritardi = {}; o.maxRit = null;
  o.seq.forEach(c => { const x = ALP.ritardo(c.previsto, o.tappe[c.id]); o.ritardi[c.id] = x; if (x !== null && x > 0 && (o.maxRit === null || x > o.maxRit)) o.maxRit = x; });
  const t = o.seq[0]; o.dir = p && p.dir >= 0 ? p.dir : null;
  if (o.dir === null) { const m = t && t.lat ? [t.lat, t.lng] : ALP.CASA; o.dir = Math.atan2((m[1] - qui[1]) * Math.cos(qui[0] * Math.PI / 180), m[0] - qui[0]) * 180 / Math.PI; }
  o.chiave = o.stato === 'pizzeria' ? (pend.length ? 1e13 : 0) - (r.dal ? ora - r.dal : 0) : 2e13 + (o.rientro || 0);
  return o;
}

/* ---------- struttura della pagina ---------- */
function struttura() {
  $('#ui').innerHTML = `
    <div class="testa vetro"><img src="../img/marchio.png" alt="Amo la Pizza"><b>Centrale</b><span class="ora" id="ora"></span>
      <button class="b-s" id="vOrari">Orari consegne</button><button class="b-s" id="fine">Fine turno e totali</button><button class="b-p" id="nuova">+ Consegna</button></div>
    <div class="vers" id="vers"></div>
    <div class="col vetro"><h3>Rider in servizio <small id="nr"></small></h3><div class="lista" id="lista"></div></div>
    <div class="vass vetro"><h3><span id="na">Da assegnare</span><small>Tieni premuto e trascina sul rider · tocca per modificare</small></h3><div class="carte" id="carte"></div></div>
    <div id="orari"><div style="display:flex;align-items:center;gap:10px">
      <img src="../img/marchio.png" alt="Amo la Pizza" style="height:30px">
      <b style="font-size:19px">ORARI CONSEGNE</b><span class="muto" id="oraTesta" style="font-size:13px;font-weight:700"></span>
      <div style="flex:1"></div>
      <div class="seg" id="serv" style="width:210px"><button data-s="Pranzo">Pranzo</button><button data-s="Cena">Cena</button></div>
      <button class="mini" id="nuova2" style="height:34px">+ Consegna</button>
      <button class="mini" id="vMappa" style="height:34px">Mappa rider</button></div>
      <div class="og"><div class="tab"><div class="rg h"><span>FASCIA</span><span>PIZZE</span><span>BURGER</span><span>CONS · consegne</span><span>VAP · asporto</span></div><div class="corpo" id="fasce"></div></div>
      <div class="lat"><div id="dett"></div>
        <div class="box"><b style="font-size:17px">Al telefono: che orario dico?</b>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div class="cnt"><span>PIZZE</span><div><button data-q="p-1" aria-label="Meno pizze">−</button><b id="qp">4</b><button class="pi" data-q="p1" aria-label="Più pizze">+</button></div></div>
            <div class="cnt"><span>BURGER</span><div><button data-q="b-1" aria-label="Meno burger">−</button><b id="qb">0</b><button class="pi" data-q="b1" aria-label="Più burger">+</button></div></div></div>
          <div class="seg" id="tipoQ"><button data-t="DOMICILIO">🛵 Domicilio</button><button data-t="ASPORTO">🥡 Asporto</button></div>
          <input id="qpaese" placeholder="Paese (per il tempo di strada)" value="San Paolo d'Argon">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px" id="slots"></div>
          <div class="sugg" id="sugg"></div></div>
      </div></div></div>`;
  $('#nuova').onclick = () => schedaConsegna();
  $('#nuova2').onclick = () => schedaConsegna();
  $('#fine').onclick = fineTurno;
  $('#vOrari').onclick = () => { VISTA = 'orari'; $('#orari').classList.add('on'); presto(); };
  $('#vMappa').onclick = () => { VISTA = 'mappa'; $('#orari').classList.remove('on'); };
  tutti('#serv button').forEach(b => b.onclick = () => { SERV = b.dataset.s; presto(); });
  tutti('#tipoQ button').forEach(b => b.onclick = () => { Q.tipo = b.dataset.t; presto(); });
  tutti('[data-q]').forEach(b => b.onclick = () => { const k = b.dataset.q[0], d = Number(b.dataset.q.slice(1)); Q[k] = Math.max(0, Q[k] + d); presto(); });
  $('#qpaese').oninput = () => { Q.paese = $('#qpaese').value; presto(); };
  if (!map) {
    map = L.map('mappa', { zoomControl: false }).setView(ALP.CASA, 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    livello = L.layerGroup().addTo(map);
  }
  trascina();
}

function disegna() {
  if (!$('#lista')) return;
  if (VISTA === 'orari') disegnaOrari();
  $('#ora').textContent = new Date().toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric' }) + ' · ' + ALP.servizio() + ' · ' + hhmm(Date.now());
  const ri = inServizio().map(info).sort((a, b) => a.chiave - b.chiave);
  $('#nr').textContent = ri.length ? ri.length + ' · primo libero in alto' : '';
  $('#lista').innerHTML = ri.length ? ri.map(cardRider).join('') : '<div class="vuoto">Nessun rider in servizio. Si accendono quando iniziano il turno dalla loro app.</div>';
  tutti('.rc').forEach(el => el.onclick = () => schedaRider(el.dataset.rider));
  const da = daAssegnare();
  $('#na').textContent = 'Da assegnare · ' + da.length;
  $('#carte').innerHTML = da.length ? da.map(cardConsegna).join('') : '<div class="vuoto">Nessuna consegna in attesa. Premi “+ Consegna”.</div>';
  const va = VERS.filter(v => v.stato === 'attesa');
  $('#vers').innerHTML = va.map(v => `<div class="vetro">💶 ${esc(v.rider)} lascia <b>${euro(v.contanti)}</b> in cassa <button data-v="${v.id}">✓ Conferma</button></div>`).join('');
  tutti('[data-v]').forEach(b => b.onclick = () => confermaVersamento(b.dataset.v));
  mappa(ri, da);
}

function cardRider(o) {
  const pill = o.stato === 'pizzeria' ? '<span class="pill p-piz">IN PIZZERIA</span>' : o.stato === 'andata' ? '<span class="pill p-and">→ IN ANDATA</span>' : '<span class="pill p-rie">↩ IN RIENTRO</span>';
  let corpo = '';
  if (o.stato === 'andata') {
    const c = o.seq[0], rit = o.ritardi[c.id];
    corpo = `<span class="via">→ ${esc(c.via)}, ${esc(c.paese)}</span>
      <span class="riga ${rit > 0 ? 'tardi' : ''}">Arrivo ${hhmm(o.tappe[c.id])}${rit > 0 ? ' · ' + rit + ' min di ritardo' : ''}${o.seq.length > 1 ? ' · poi altre ' + (o.seq.length - 1) : ''}</span>
      <span class="riga">Rientro <b style="color:var(--ink)">${hhmm(o.rientro)}</b>${o.maxRit > 0 && rit <= 0 ? ' · <span class="tardi">ritardo su una consegna</span>' : ''}</span>`;
  } else if (o.stato === 'rientro') corpo = `<span class="riga">In pizzeria alle <span class="forte">${hhmm(o.rientro)}</span></span>`;
  else if (o.pend.length) corpo = `<span class="riga forte">${o.pend.length} ${o.pend.length === 1 ? 'consegna' : 'consegne'} da portare</span><span class="riga">${o.seq.map(c => esc(c.via)).join(' → ')}</span>`;
  else corpo = `<span class="riga">Libero${o.r.dal ? ' da ' + Math.max(0, Math.round((Date.now() - o.r.dal) / 60000)) + ' min' : ''}</span>`;
  const t = TURNI.find(x => x.id === o.r.turno);
  return `<div class="rc ${o.stato === 'pizzeria' && !o.pend.length ? 'lib' : ''}" data-rider="${esc(o.n)}"><span class="pal" style="background:${o.colore}"></span>
    <div class="t"><div class="r1"><b class="nome">${esc(o.n)}${t && t.furgone ? ' 🚐' : ''}</b>${pill}</div>${corpo}</div></div>`;
}
function cardConsegna(c) {
  return `<div class="ca" data-c="${c.id}"><div class="r1"><b>${esc(c.via)}</b>${c.previsto ? `<span class="ora">${esc(c.previsto)}</span>` : ''}</div>
    <span>${esc(c.paese)}${c.cliente ? ' · ' + esc(c.cliente) : ''}${c.lat ? '' : ' · 📍 cerco…'}</span>
    ${c.lontano && !c.lontanoOk ? `<span style="color:#b3261e;font-weight:800">⚠️ ${c.lontano} min dalla pizzeria: controlla il paese</span>` : ''}
    <span class="soldi"><b style="font-size:15px">${c.importo ? euro(c.importo) : '—'}</b> · ${c.pagamento === 'SumUp' ? 'SumUp' : 'Contanti'}</span></div>`;
}

/* ---------- mappa: frecce dei rider (piena = va dal cliente, vuota con casetta = torna) ---------- */
function freccia(o) {
  const vuota = o.stato === 'rientro', vecchia = o.r.giro && !o.pos;
  const svg = `<svg width="44" height="44" viewBox="-22 -22 44 44"><circle r="18" fill="${vuota ? '#fff' : o.colore}" stroke="${vuota ? o.colore : '#fff'}" stroke-width="4"/>
    <path d="M-7 -8 L10 0 L-7 8 L-3 0 Z" fill="${vuota ? o.colore : '#fff'}" transform="rotate(${Math.round(o.dir - 90)})"/></svg>`;
  return `<div class="freccia" style="opacity:${vecchia ? .55 : 1}">${o.maxRit > 0 ? '<span class="anel"></span>' : ''}${svg}
    ${vuota ? '<span class="casetta"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6 L6 1.5 L11 6 M2.5 5 V10.5 H9.5 V5" stroke="#302f31" stroke-width="1.6" fill="none"/></svg></span>' : ''}
    <span class="nm">${esc(o.n)}</span></div>`;
}
function mappa(ri, da) {
  livello.clearLayers();
  L.marker(ALP.CASA, { icon: L.divIcon({ className: 'mk', html: '<div class="casa"><i></i><img src="../img/marchio.png" alt="" style="width:30px;height:auto;max-width:30px"></div>', iconSize: [52, 52], iconAnchor: [26, 26] }), zIndexOffset: 500 }).addTo(livello);
  const tutti_ = [ALP.CASA];
  ri.forEach(o => {
    if (o.r.giro) {
      const linea = [o.qui].concat(o.seq.filter(c => c.lat).map(c => [c.lat, c.lng])).concat([ALP.CASA]);
      if (o.stato === 'andata') {
        const via = linea.slice(0, -1);
        if (via.length > 1) { L.polyline(via, { color: '#fff', weight: 10, opacity: .9 }).addTo(livello); L.polyline(via, { color: o.colore, weight: 6, className: 'flusso' }).addTo(livello); }
      } else L.polyline([o.qui, ALP.CASA], { color: o.colore, weight: 5, opacity: .8, className: 'flusso' }).addTo(livello);
      L.marker(o.qui, { icon: L.divIcon({ className: 'mk', html: freccia(o), iconSize: [44, 44] }), zIndexOffset: 1000 }).addTo(livello).on('click', () => schedaRider(o.n));
      tutti_.push(o.qui);
    }
    o.seq.forEach((c, i) => { if (c.lat) { L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'mk', html: `<div class="tap" style="border-color:${o.colore}">${i + 1}</div>`, iconSize: [26, 26] }) }).addTo(livello); tutti_.push([c.lat, c.lng]); } });
  });
  da.forEach(c => { if (c.lat) { L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'mk', html: '<div class="grigio"></div>', iconSize: [22, 22] }) }).bindTooltip(esc(c.via)).addTo(livello).on('click', () => schedaConsegna(c)); tutti_.push([c.lat, c.lng]); } });
  if (primaVolta && tutti_.length > 1) { primaVolta = false; map.fitBounds(tutti_, { paddingTopLeft: [40, 100], paddingBottomRight: [Math.min(460, innerWidth * .4), 260], maxZoom: 15 }); }
}

/* ---------- tieni premuto e trascina sul rider ---------- */
function trascina() {
  let timer = null, sorg = null, fant = null, x0 = 0, y0 = 0, sopra = null, dx = 0, dy = 0;
  const pulisci = () => { clearTimeout(timer); timer = null; if (fant) fant.remove(); fant = null; if (sorg) sorg.classList.remove('su'); sorg = null; tutti('.rc.bersaglio').forEach(e => e.classList.remove('bersaglio')); sopra = null; };
  document.addEventListener('pointerdown', e => {
    const ca = e.target.closest('.ca'); if (!ca) return;
    x0 = e.clientX; y0 = e.clientY; sorg = ca;
    timer = setTimeout(() => {
      timer = null; const r = ca.getBoundingClientRect(); dx = x0 - r.left; dy = y0 - r.top;
      fant = ca.cloneNode(true); fant.classList.add('fantasma'); fant.style.width = r.width + 'px'; fant.style.left = r.left + 'px'; fant.style.top = r.top + 'px';
      document.body.appendChild(fant); ca.classList.add('su'); if (navigator.vibrate) navigator.vibrate(30);
    }, 320);
  });
  document.addEventListener('pointermove', e => {
    if (!sorg) return;
    if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) { clearTimeout(timer); timer = null; }
    if (!fant) return;
    e.preventDefault();
    fant.style.left = (e.clientX - dx) + 'px'; fant.style.top = (e.clientY - dy) + 'px';
    const el = document.elementFromPoint(e.clientX, e.clientY), rc = el && el.closest('.rc');
    if (rc !== sopra) { if (sopra) sopra.classList.remove('bersaglio'); sopra = rc; if (rc) rc.classList.add('bersaglio'); }
  }, { passive: false });
  document.addEventListener('pointerup', () => {
    if (!sorg) return;
    const id = sorg.dataset.c;
    if (fant) { if (sopra) assegna(id, sopra.dataset.rider); }
    else if (timer) schedaConsegna(CONS.find(c => c.id === id));
    pulisci();
  });
  document.addEventListener('pointercancel', pulisci);
}

/* ---------- assegnare / spostare (si vede subito, si salva in sottofondo) ---------- */
async function assegna(id, nome, giaChiesto) {
  const c = CONS.find(x => x.id === id), r = RIDER.find(x => x.nome === nome); if (!c || !r || c.rider === nome) return;
  const forzata = c.stato === 'consegnata';
  if (!giaChiesto) {
    if (c.lontano && !c.lontanoOk && !confirm(c.via + ', ' + c.paese + ' è a ' + c.lontano + ' minuti dalla pizzeria: l\'indirizzo è giusto?')) return schedaConsegna(c);
    if (forzata && !confirm('Consegna già fatta da ' + c.rider + '. Forzo il cambio a ' + nome + '? Portafoglio e report si ricalcolano.')) return;
    if (!forzata && c.stato === 'partita' && !confirm(c.rider + ' è già in giro con le pizze: le ha passate di persona a ' + nome + '?')) return;
  }
  const ora = Date.now();
  FB.cambia('consegne/' + id, {
    rider: nome, stato: forzata ? 'consegnata' : (r.giro ? 'partita' : 'assegnata'), giro: forzata ? (c.giro || '') : (r.giro || ''), assegnata: ora, agg: ora,
    storia: await FB.aggiungiA({ t: ora, da: c.rider || '', a: nome, chi: HUB, tipo: forzata ? 'forzata dalla centrale' : (c.rider ? 'spostata dalla centrale' : 'assegnata dalla cassa') })
  }).catch(e => ALP.toast('Non salvato: ' + e.message, 1));
  ALP.toast(c.via + ' → ' + nome);
}
function confermaVersamento(id) {
  const v = VERS.find(x => x.id === id); if (!v) return;
  FB.cambia('versamenti/' + id, { stato: 'ok', confermatoDa: HUB, confermato: Date.now(), agg: Date.now() }).catch(e => ALP.toast('Non salvato: ' + e.message, 1));
  ALP.toast('Contanti di ' + v.rider + ' confermati ✓');
}


/* ---------- ORARI CONSEGNE (il foglio, che si riempie da solo) ---------- */
const vive = c => c.stato !== 'annullata';
/** minuti di strada stimati verso la consegna (dalle coordinate, altrimenti un valore prudente) */
function strada(c) { return c.lat ? ALP.minuti(ALP.CASA, [c.lat, c.lng]) : STRADA_DEF; }
/** fascia in cui la pizza deve uscire dal forno */
function fasciaForno(c) {
  const p = c.previsto || '';
  if (!p) return '';
  return ALP.fascia(c.tipo === 'ASPORTO' ? p : ALP.meno(p, strada(c) + ALP.SOSTA));
}
function perFascia() {
  const m = {};
  CONS.filter(vive).forEach(c => { const f = fasciaForno(c); if (!f) return; (m[f] = m[f] || { c: [], a: [] })[c.tipo === 'ASPORTO' ? 'a' : 'c'].push(c); });
  return m;
}
const conta = l => l.reduce((o, c) => ({ p: o.p + (Number(c.pizze) || 0), b: o.b + (Number(c.burger) || 0) }), { p: 0, b: 0 });
const colore = v => v >= MAX ? '#b8372f' : (v >= GIALLO ? '#d99a00' : '#1d8f4e');
function barra(v) {
  const c = colore(v);
  return `<span class="bar"><i><u style="width:${Math.round(Math.min(v, MAX) / MAX * 100)}%;background:${c}"></u></i><b style="color:${v >= GIALLO ? c : 'var(--ink)'}">${v}</b></span>`;
}
function celle(l, cl) {
  let h = '';
  for (let k = 0; k < 4; k++) {
    if (k < l.length && (k < 3 || l.length === 4)) {
      const c = l[k], nome = cl === 'c' ? ALP.corto(c.via) : (String(c.cliente || '').trim().split(/\s+/)[0] || '—');
      const pr = c.lontano && !c.lontanoOk;
      h += `<div class="${pr ? 'x' : cl}" data-o="${c.id}" title="${esc(c.via || c.cliente)}">${esc(nome)}${pr ? ' ⚠️' : ''}</div>`;
    } else if (k === 3 && l.length > 4) h += `<div class="p" data-f="${l[0] ? fasciaForno(l[0]) : ''}">+${l.length - 3}</div>`;
    else h += '<div class="v"></div>';
  }
  return `<div class="cel">${h}</div>`;
}
function disegnaOrari() {
  const m = perFascia(), fasce = ALP.fasce(SERV), ora = ALP.hhmm(Date.now()), adesso = ALP.fascia(ora);
  $('#oraTesta').textContent = new Date().toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + ora + ' · si riempie da solo con le comande';
  tutti('#serv button').forEach(b => b.classList.toggle('on', b.dataset.s === SERV));
  $('#fasce').innerHTML = fasce.map((f, i) => {
    const d = m[f] || { c: [], a: [] }, t = conta(d.c.concat(d.a));
    const cl = f < adesso ? 'pas' : (f === adesso ? 'now' : (i % 2 ? 'alt' : ''));
    return `<div class="rg ${cl}"><b class="f">${f}</b>${barra(t.p)}${barra(t.b)}${celle(d.c, 'c')}${celle(d.a, 'a')}</div>`;
  }).join('');
  tutti('#fasce [data-o]').forEach(e => e.onclick = () => { SELE = e.dataset.o; disegnaOrari(); });
  tutti('#fasce [data-f]').forEach(e => e.onclick = () => apriFascia(e.dataset.f, m));
  dettaglio();
  consiglio(m);
}
function dettaglio() {
  const c = CONS.find(x => x.id === SELE);
  if (!c) { $('#dett').innerHTML = '<div class="box"><span class="muto" style="font-size:13px">Tocca una casella per vedere l\'ordine: indirizzo, pizze, totale, pagamento.</span></div>'; return; }
  const r = c.rider ? RIDER.find(x => x.nome === c.rider) : null;
  $('#dett').innerHTML = `<div class="box sel">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:17px">${esc(c.tipo === 'ASPORTO' ? (c.cliente || 'Asporto') : ALP.corto(c.via))}</b>
      <span class="muto" style="font-size:13px">${esc(c.previsto || '')}${c.numero ? ' · N. ' + esc(c.numero) : ''}</span></div>
    <div style="font-size:14px">${c.tipo === 'ASPORTO' ? '🥡 Ritiro del cliente' : '🛵 ' + esc(c.via) + ', ' + esc(c.paese)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${c.pizze ? `<span class="pill p-off">${c.pizze} pizze</span>` : ''}${c.burger ? `<span class="pill p-off">${c.burger} burger</span>` : ''}
      ${c.importo ? `<span class="pill" style="background:${c.pagamento === 'SumUp' ? '#dde8ff;color:#123f8c' : '#e2f3e8;color:#1d7a3d'}">${euro(c.importo)} ${c.pagamento === 'SumUp' ? 'SumUp' : 'contanti'}</span>` : ''}
      ${c.tipo !== 'ASPORTO' ? `<span class="pill p-off">${strada(c)} min di strada</span>` : ''}</div>
    ${c.cliente || c.telefono ? `<span class="muto" style="font-size:12px">${esc(c.cliente)}${c.telefono ? ' · ' + esc(c.telefono) : ''}${c.cassiere ? ' · cassa ' + esc(c.cassiere) : ''}</span>` : ''}
    ${c.rider ? `<span class="muto" style="font-size:12px">Rider: <b style="color:var(--ink)">${esc(c.rider)}</b>${c.stato === 'consegnata' ? ' · consegnata' : ''}</span>` : ''}
    <div style="display:flex;gap:6px"><button class="btn s" id="dMod" style="min-height:40px;font-size:13px">Apri e modifica</button>
      ${c.tipo === 'ASPORTO' ? '' : `<button class="btn p" id="dAss" style="min-height:40px;font-size:13px">${c.rider ? 'Cambia rider' : 'Assegna rider'}</button>`}</div></div>`;
  $('#dMod').onclick = () => schedaConsegna(c);
  if ($('#dAss')) $('#dAss').onclick = () => scegliRider(c);
}
function scegliRider(c) {
  const ri = inServizio(); if (!ri.length) return ALP.toast('Nessun rider in servizio', 1);
  apri(`<div class="maniglia"></div><h2 style="margin:0">${esc(c.via)} → a chi?</h2>
    <div class="chips" style="margin-top:12px">${ri.map(r => `<button data-a="${esc(r.nome)}"><i style="background:${ALP.colore(r.nome)}"></i>${esc(r.nome)}</button>`).join('')}</div>
    <button class="btn s" style="margin-top:14px" id="chiudi">Annulla</button>`, () => {
    $('#chiudi').onclick = chiudi;
    tutti('[data-a]').forEach(b => b.onclick = () => { assegna(c.id, b.dataset.a); chiudi(); });
  });
}
function apriFascia(f, m) {
  const d = m[f] || { c: [], a: [] }, l = d.c.concat(d.a); if (!l.length) return;
  const t = conta(l);
  apri(`<div class="maniglia"></div><h2 style="margin:0">Fascia ${f} · ${t.p} pizze, ${t.b} burger</h2>
    ${l.map(c => `<div class="riga-c"><span style="font-size:18px">${c.tipo === 'ASPORTO' ? '🥡' : '🛵'}</span>
      <div class="t"><b>${esc(c.tipo === 'ASPORTO' ? (c.cliente || 'Asporto') : c.via)}</b>
      <div class="muto" style="font-size:13px">per le ${esc(c.previsto || '')} · ${c.pizze || 0}P ${c.burger || 0}B${c.importo ? ' · ' + euro(c.importo) : ''}${c.rider ? ' · ' + esc(c.rider) : ''}</div></div>
      <button class="mini" data-o="${c.id}">Apri</button></div>`).join('')}
    <button class="btn s" style="margin-top:14px" id="chiudi">Chiudi</button>`, () => {
    $('#chiudi').onclick = chiudi;
    tutti('[data-o]').forEach(b => b.onclick = () => { SELE = b.dataset.o; chiudi(); disegnaOrari(); });
  });
}
/** quali fasce sono libere per l'ordine che stiamo prendendo al telefono */
function consiglio(m) {
  $('#qp').textContent = Q.p; $('#qb').textContent = Q.b;
  tutti('#tipoQ button').forEach(b => b.classList.toggle('on', b.dataset.t === Q.tipo));
  const g = ALP.ls.get('geo:' + ('x, ' + Q.paese + ', BG').replace(/\s+/g, ' ').toLowerCase());
  const min = Q.tipo === 'ASPORTO' ? 0 : (CONS.filter(c => c.lat && (c.paese || '').toLowerCase() === Q.paese.toLowerCase()).map(strada)[0] || STRADA_DEF);
  const fasce = ALP.fasce(SERV), adesso = ALP.fascia(ALP.hhmm(Date.now() + 10 * 60000));
  const libere = fasce.filter(f => f >= adesso).map(f => {
    const d = m[f] || { c: [], a: [] }, t = conta(d.c.concat(d.a));
    return { f, p: t.p, b: t.b, resta: MAX - t.p, ok: t.p + Q.p <= MAX && t.b + Q.b <= MAX };
  });
  const tre = libere.slice(0, 3), prima = libere.find(x => x.ok);
  $('#slots').innerHTML = tre.map(x => {
    const cons = Q.tipo === 'ASPORTO' ? x.f : ALP.hhmm(new Date('2000-01-01T' + x.f + ':00').getTime() + (min + ALP.SOSTA) * 60000);
    return `<button class="slot ${x.ok ? 'ok' : 'no'}">${esc(cons)}<small>${x.ok ? x.resta + ' libere' : 'pieno'}</small></button>`;
  }).join('') || '<span class="muto" style="font-size:13px">Servizio finito</span>';
  if (!prima) { $('#sugg').textContent = 'Tutte le fasce rimaste sono piene: decidi tu.'; return; }
  const arrivo = Q.tipo === 'ASPORTO' ? prima.f : ALP.hhmm(new Date('2000-01-01T' + prima.f + ':00').getTime() + (min + ALP.SOSTA) * 60000);
  const liberi = inServizio().map(info).filter(o => o.stato === 'pizzeria' || (o.rientro && ALP.hhmm(o.rientro) <= arrivo));
  $('#sugg').innerHTML = `💡 Di' <b>${esc(arrivo)}</b>${Q.tipo === 'ASPORTO' ? ' per il ritiro' : `: forno alle ${esc(prima.f)}, ${min} min di strada`}.`
    + (Q.tipo === 'ASPORTO' ? '' : ` Rider: ${liberi.length ? '<b>' + liberi.map(o => esc(o.n)).join(', ') + '</b>' : '<b style="color:#b3261e">nessuno libero a quell\'ora</b>'}.`);
}

/* ---------- fogli ---------- */
function apri(html, dopo) {
  $('#extra').innerHTML = `<div class="velo" id="velo"><div class="foglio">${html}</div></div>`;
  $('#velo').onclick = e => { if (e.target.id === 'velo') chiudi(); };
  if (dopo) dopo();
}
function chiudi() { $('#extra').innerHTML = ''; }

function schedaConsegna(c) {
  const nuova = !c; c = c || { pagamento: 'Contanti', paese: "San Paolo d'Argon", tipo: 'DOMICILIO' };
  let pag = c.pagamento || 'Contanti', a = c.rider || '', tipo = c.tipo === 'ASPORTO' ? 'ASPORTO' : 'DOMICILIO';
  const ri = inServizio();
  apri(`<div class="maniglia"></div><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${nuova ? 'Nuova consegna' : 'Consegna'}</h2>
      ${nuova ? '' : `<button class="mini" id="elim" style="color:var(--rosso2)">Elimina</button>`}</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      ${nuova ? `<button class="btn n" id="foto">📷 Foto comanda + scontrino</button><input type="file" accept="image/*" capture="environment" id="file" hidden><div class="muto" id="st" style="text-align:center;font-size:14px"></div>` : ''}
      <div id="avvisi">${c.lontano && !c.lontanoOk ? `<div class="avv err">⚠️ Questo indirizzo risulta a ${c.lontano} minuti dalla pizzeria: controlla via e paese.</div>` : ''}</div>
      <div class="seg" id="tipo" style="max-width:360px"><button data-t="DOMICILIO">🛵 Domicilio</button><button data-t="ASPORTO">🥡 Asporto (ritira lui)</button></div>
      <div class="grid2" id="rigaVia"><label class="c">Via e numero<input id="f_via" value="${esc(c.via)}" placeholder="Via Roma 14"></label><label class="c">Paese<input id="f_paese" value="${esc(c.paese)}"></label></div>
      <div class="grid2"><label class="c">Cliente<input id="f_cli" value="${esc(c.cliente)}"></label><label class="c">Telefono<input id="f_tel" inputmode="tel" value="${esc(c.telefono)}"></label></div>
      <div class="grid3"><label class="c">Orario PER LE<input id="f_ora" type="time" value="${esc(c.previsto)}"></label><label class="c">Totale €<input id="f_imp" inputmode="decimal" value="${c.importo ? String(c.importo).replace('.', ',') : ''}"></label>
        <label class="c">Pagamento<div class="seg" id="pag"><button data-p="Contanti">Contanti</button><button data-p="SumUp">SumUp</button></div></label></div>
      <div class="grid3"><label class="c">Pizze (PIZ)<input id="f_piz" inputmode="numeric" value="${c.pizze || ''}"></label><label class="c">Burger (BUR)<input id="f_bur" inputmode="numeric" value="${c.burger || ''}"></label>
        <label class="c">N. ordine<input id="f_num" value="${esc(c.numero)}"></label></div>
      <label class="c">Note per il rider<input id="f_note" value="${esc(c.note)}" placeholder="citofono, scala, piano…"></label>
      <div><div class="c" style="font-size:12px;font-weight:800;color:var(--muto);margin-bottom:6px">ASSEGNA A (facoltativo)</div><div class="chips" id="chips">
        <button data-a="" class="${a ? '' : 'on'}">Dopo</button>${ri.map(r => `<button data-a="${esc(r.nome)}" class="${a === r.nome ? 'on' : ''}"><i style="background:${ALP.colore(r.nome)}"></i>${esc(r.nome)}</button>`).join('')}</div></div>
      <div style="display:flex;gap:10px"><button class="btn s" id="annulla">Annulla</button><button class="btn p" id="salva">Salva</button></div></div>`, () => {
    const segna = () => {
      tutti('#pag button').forEach(b => b.classList.toggle('on', b.dataset.p === pag));
      tutti('#chips button').forEach(b => b.classList.toggle('on', b.dataset.a === a));
      tutti('#tipo button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo));
      $('#rigaVia').style.display = tipo === 'ASPORTO' ? 'none' : '';
      $('#chips').parentElement.style.display = tipo === 'ASPORTO' ? 'none' : '';
    };
    tutti('#tipo button').forEach(b => b.onclick = () => { tipo = b.dataset.t; if (tipo === 'ASPORTO') a = ''; segna(); });
    tutti('#pag button').forEach(b => b.onclick = () => { pag = b.dataset.p; segna(); });
    tutti('#chips button').forEach(b => b.onclick = () => { a = b.dataset.a; segna(); }); segna();
    $('#annulla').onclick = chiudi;
    if ($('#elim')) $('#elim').onclick = () => { if (confirm('Elimino questa consegna?')) { FB.cambia('consegne/' + c.id, { stato: 'annullata', agg: Date.now() }); chiudi(); } };
    if (nuova) {
      $('#foto').onclick = () => $('#file').click();
      $('#file').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        const t0 = Date.now(); $('#st').textContent = 'Leggo comanda e scontrino… intanto puoi scrivere';
        try {
          const o = await ALP.leggiFoto(await ALP.comprimi(f, 1600), 'ordine', SEG.gemini, SEG.modello);
          const metti = (id, v) => { if (v && !$(id).value) $(id).value = v; };
          metti('#f_via', o.via); if (o.paese) $('#f_paese').value = o.paese; metti('#f_cli', o.cliente); metti('#f_tel', o.telefono); metti('#f_ora', o.previsto);
          if (o.importo) $('#f_imp').value = String(o.importo).replace('.', ','); metti('#f_note', o.note);
          if (o.pizze) $('#f_piz').value = o.pizze; if (o.burger) $('#f_bur').value = o.burger; metti('#f_num', o.numero);
          if (o.pagamento) pag = /sum/i.test(o.pagamento) ? 'SumUp' : 'Contanti';
          if (/asporto/i.test(o.tipo || '')) { tipo = 'ASPORTO'; a = ''; }
          segna();
          c.cassiere = o.cassiere || '';
          $('#avvisi').innerHTML = tipo === 'ASPORTO' ? '<div class="avv">🥡 Comanda di ASPORTO: va nella colonna VAP, senza rider.</div>' : '';
          $('#st').textContent = 'Letta in ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s ✓ · controlla i campi';
        } catch (er) { $('#st').textContent = SEG.gemini ? 'Lettura non riuscita: scrivi a mano' : 'Lettura foto non ancora attiva (Fine turno › Impostazioni): scrivi a mano'; }
      };
    }
    $('#salva').onclick = async () => {
      const asp = tipo === 'ASPORTO';
      const via = asp ? '' : $('#f_via').value.trim(), paese = asp ? '' : ($('#f_paese').value.trim() || "San Paolo d'Argon");
      const cliente = $('#f_cli').value.trim();
      if (!asp && !via) return ALP.toast('Manca la via', 1);
      if (asp && !cliente) return ALP.toast('Manca il nome del cliente', 1);
      if (!$('#f_ora').value) return ALP.toast("Manca l'orario PER LE", 1);
      const ora = Date.now(), r = RIDER.find(x => x.nome === a), id = c.id || ALP.id();
      const d = { tipo, via, paese, cliente, telefono: $('#f_tel').value.replace(/\s/g, ''), previsto: $('#f_ora').value, importo: ALP.num($('#f_imp').value),
        pizze: Math.round(ALP.num($('#f_piz').value)), burger: Math.round(ALP.num($('#f_bur').value)), numero: $('#f_num').value.trim(),
        pagamento: pag, note: $('#f_note').value.trim(), agg: ora };
      if (nuova) {
        Object.assign(d, { id, data: ALP.oggi(), servizio: ALP.servizio(), creata: ora, creataDa: HUB, cassiere: c.cassiere || '',
          rider: a, stato: asp ? 'asporto' : (a ? (r && r.giro ? 'partita' : 'assegnata') : 'attesa'), giro: a && r && r.giro ? r.giro : '', lat: null, lng: null,
          storia: a ? [{ t: ora, da: '', a, chi: HUB, tipo: 'assegnata dalla cassa' }] : [] });
        if (!asp) { const g = ALP.ls.get('geo:' + (via + ', ' + paese + ', BG').replace(/\s+/g, ' ').toLowerCase()); if (g) { const p = JSON.parse(g); d.lat = p[0]; d.lng = p[1]; } }
        FB.scrivi('consegne/' + id, d).catch(e => ALP.toast('Non salvato: ' + e.message, 1));
      } else {
        if (via !== c.via || paese !== c.paese) { d.lat = null; d.lng = null; d.lontano = 0; d.lontanoOk = false; }
        FB.cambia('consegne/' + id, d).catch(e => ALP.toast('Non salvato: ' + e.message, 1));
        if (a !== (c.rider || '') && a) setTimeout(() => assegna(id, a), 50);
      }
      SELE = id; chiudi(); ALP.toast(nuova ? (asp ? 'Asporto salvato' : 'Consegna salvata' + (a ? ' e assegnata a ' + a : '')) : 'Modifiche salvate');
    };
  });
}

function schedaRider(nome) {
  const r = RIDER.find(x => x.nome === nome); if (!r) return;
  const o = info(r), t = TURNI.find(x => x.id === r.turno);
  const fatte = CONS.filter(c => c.rider === nome && c.stato === 'consegnata').sort((a, b) => b.consegnata - a.consegnata);
  const altri = inServizio().filter(x => x.nome !== nome);
  const riga = (c, i, eta) => `<div class="riga-c"><span class="tap" style="border-color:${o.colore}">${eta ? i + 1 : '✓'}</span><div class="t"><b>${esc(c.via)}</b>, ${esc(c.paese)}
      <div class="muto" style="font-size:13px">${eta ? 'arrivo ' + hhmm(o.tappe[c.id]) + (o.ritardi[c.id] > 0 ? ' · <b style="color:#b3261e">+' + o.ritardi[c.id] + ' min</b>' : '') : 'consegnata alle ' + hhmm(c.consegnata)}
      · ${c.importo ? euro(c.importo) : ''} ${c.pagamento === 'SumUp' ? 'SumUp' : 'contanti'}${c.storia && c.storia.length > 1 ? ' · ⇄ ' + (c.storia.length - 1) + ' cambi' : ''}</div></div>
      ${altri.length ? `<button class="mini" data-sposta="${c.id}">Sposta…</button>` : ''}</div>`;
  apri(`<div class="maniglia"></div><div style="display:flex;gap:10px;align-items:center"><span style="width:18px;height:18px;border-radius:50%;background:${o.colore}"></span><h2 style="margin:0;flex:1">${esc(nome)}</h2>
      <span class="pill ${o.stato === 'pizzeria' ? 'p-piz' : o.stato === 'andata' ? 'p-and' : 'p-rie'}">${o.stato === 'pizzeria' ? 'IN PIZZERIA' : o.stato === 'andata' ? '→ IN ANDATA' : '↩ IN RIENTRO'}</span></div>
    <div class="muto" style="margin:6px 0 4px">${t ? 'In servizio dalle ' + hhmm(t.inizio) + ' · km inizio ' + t.kmInizio + (t.furgone ? ' · 🚐 furgone' : '') + (t.manualeInizio || t.correttoInizio ? ' · ⚠️ km a mano' : '') : ''}${o.rientro ? ' · rientro ' + hhmm(o.rientro) : ''}</div>
    ${o.seq.length ? '<h3 style="margin:10px 0 0">Da consegnare</h3>' + o.seq.map((c, i) => riga(c, i, true)).join('') : ''}
    ${fatte.length ? '<h3 style="margin:14px 0 0">Consegnate oggi</h3>' + fatte.map(c => riga(c, 0, false)).join('') : ''}
    ${!o.seq.length && !fatte.length ? '<div class="vuoto">Nessuna consegna oggi.</div>' : ''}
    <button class="btn s" style="margin-top:14px" id="chiudi">Chiudi</button>`, () => {
    $('#chiudi').onclick = chiudi;
    if (o.pos) map.setView([o.pos.lat, o.pos.lng], 15, { animate: true });
    tutti('[data-sposta]').forEach(b => b.onclick = () => {
      const c = CONS.find(x => x.id === b.dataset.sposta);
      b.parentElement.insertAdjacentHTML('afterend', `<div class="chips" style="padding:0 0 10px 36px">${altri.map(x => `<button data-a="${esc(x.nome)}"><i style="background:${ALP.colore(x.nome)}"></i>${esc(x.nome)}</button>`).join('')}</div>`);
      b.remove();
      tutti('[data-a]').forEach(k => k.onclick = () => { assegna(c.id, k.dataset.a); chiudi(); });
    });
  });
}

function fineTurno() {
  const nomi = [...new Set(TURNI.map(t => t.rider).concat(CONS.filter(c => c.rider).map(c => c.rider)))].sort();
  let T = { n: 0, cont: 0, sum: 0, vers: 0, tasca: 0, km: 0 };
  const righe = nomi.map(n => {
    const f = CONS.filter(c => c.rider === n && c.stato === 'consegnata');
    const cont = f.filter(c => c.pagamento !== 'SumUp').reduce((a, c) => a + (c.importo || 0), 0), sum = f.filter(c => c.pagamento === 'SumUp').reduce((a, c) => a + (c.importo || 0), 0);
    const vers = VERS.filter(v => v.rider === n && v.stato === 'ok').reduce((a, v) => a + (v.contanti || 0), 0), tasca = Math.max(0, cont - vers);
    const tt = TURNI.filter(t => t.rider === n), km = tt.reduce((a, t) => a + (t.km || 0), 0);
    const avv = [...new Set(tt.flatMap(t => [t.manualeInizio || t.correttoInizio ? 'km inizio a mano' : '', t.manualeFine || t.correttoFine ? 'km fine a mano' : '', t.furgone ? '🚐 furgone' : '', t.fine ? '' : 'turno aperto']).filter(String))];
    T.n += f.length; T.cont += cont; T.sum += sum; T.vers += vers; T.tasca += tasca; T.km += km;
    return `<tr><td><b>${esc(n)}</b>${avv.length ? '<div class="muto" style="font-size:12px">⚠️ ' + avv.join(' · ') + '</div>' : ''}</td><td class="n">${f.length}</td><td class="n">${euro(cont)}</td><td class="n">${euro(sum)}</td>
      <td class="n">${tasca > 0 ? '<b style="color:#b3261e">' + euro(tasca) + '</b>' : '✓'}</td><td class="n">${km ? km + ' km' : '—'}</td></tr>`;
  }).join('');
  const mese = ALP.mese(), kmMese = KM.filter(k => k.mese === mese).sort((a, b) => (a.id === 'FURGONE') - (b.id === 'FURGONE') || b.km - a.km);
  apri(`<div class="maniglia"></div><h2 style="margin:0">Fine turno · ${ALP.servizio()} ${new Date().toLocaleDateString('it-IT')}</h2>
    <table style="margin-top:10px"><tr><th>Rider</th><th class="n">Consegne</th><th class="n">Contanti</th><th class="n">SumUp</th><th class="n">In tasca</th><th class="n">Km</th></tr>${righe || '<tr><td colspan="6" class="muto">Nessun dato oggi</td></tr>'}
      <tr class="tot"><td>Totale</td><td class="n">${T.n}</td><td class="n">${euro(T.cont)}</td><td class="n">${euro(T.sum)}</td><td class="n">${euro(T.tasca)}</td><td class="n">${T.km} km</td></tr></table>
    <h3 style="margin:18px 0 6px">Km di ${new Date().toLocaleDateString('it-IT', { month: 'long' })} <small class="muto">(si azzerano il 1° del mese, il totale arriva via email)</small></h3>
    <div class="chips">${kmMese.length ? kmMese.map(k => `<button disabled style="opacity:1">${k.id === 'FURGONE' ? '🚐 Furgone' : '<i style="background:' + ALP.colore(k.id) + '"></i>' + esc(k.id)} · <b>${Math.round(k.km)} km</b></button>`).join('') : '<span class="muto">Ancora nessun km questo mese</span>'}</div>
    <details style="margin-top:18px"><summary style="font-weight:800">Impostazioni</summary>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
        <div class="avv" style="${SEG.gemini ? 'background:#e2f3e8;color:#1d7a3d' : ''}">${SEG.gemini ? '✓ Lettura delle foto attiva' : '⚠️ Lettura delle foto non attiva'}<button class="mini" id="cambiak" style="margin-left:auto">Sostituisci chiave</button></div>
        <label class="c" id="rigak" style="display:none">Nuova chiave Gemini<input id="k" type="password" placeholder="incolla qui la chiave"></label>
        <label class="c">Fondo cassa del rider €<input id="fondo" inputmode="decimal" value="${String(Number(SEG.fondo) || ALP.FONDO).replace('.', ',')}"></label>
        <button class="btn s" id="salvak">Salva impostazioni</button>
        <button class="btn s" id="esci">Esci da questo dispositivo</button></div></details>
    <button class="btn n" style="margin-top:14px" id="chiudi">Chiudi</button>`, () => {
    $('#chiudi').onclick = chiudi;
    $('#cambiak').onclick = () => { $('#rigak').style.display = ''; $('#k').focus(); };
    $('#salvak').onclick = () => {
      const d = { fondo: ALP.num($('#fondo').value) || ALP.FONDO };
      if ($('#k').value.trim()) d.gemini = $('#k').value.trim();
      FB.scrivi('segreti/app', d, true).then(() => ALP.toast('Salvato ✓'), e => ALP.toast('Non salvato: ' + e.message, 1));
    };
    $('#esci').onclick = () => { if (confirm('Esco da questo dispositivo?')) { ALP.ls.del('hub_nome'); location.reload(); } };
  });
}

if (HUB) avvia(); else login();
})();
</script>
</body>
</html>
