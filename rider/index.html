<meta name="theme-color" content="#CCD231">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --lime:#CCD231; --rosso:#C6413C; --scuro:#302F31; --grigio:#7a7a7e; --sfondo:#f4f5ec; --verde:#2e9e4f; --blu:#2563eb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif; background:var(--sfondo); color:var(--scuro); }
  .top { background:var(--lime); padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:500; }
  .top img { height:38px; }
  .top .chi { flex:1; font-weight:800; font-size:17px; }
  .top .chi small { display:block; font-weight:600; font-size:12px; opacity:.75; }
  .top button { background:rgba(255,255,255,.6); border:0; border-radius:999px; padding:8px 12px; font-weight:700; color:var(--scuro); }
  .pag { padding:14px; max-width:560px; margin:0 auto; }
  .card { background:#fff; border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 4px 18px rgba(48,47,49,.08); }
  h2 { margin:4px 0 10px; font-size:22px; font-weight:900; }
  .muto { color:var(--grigio); font-size:14px; }
  .btn { display:block; width:100%; border:0; border-radius:16px; padding:17px; font-size:18px; font-weight:800; margin-top:10px; cursor:pointer; }
  .btn.p { background:var(--rosso); color:#fff; box-shadow:0 6px 16px rgba(198,65,60,.35); }
  .btn.l { background:var(--lime); color:var(--scuro); }
  .btn.s { background:#fff; color:var(--scuro); border:2px solid #e3e4da; }
  .btn.v { background:var(--verde); color:#fff; }
  .btn:disabled { opacity:.5; }
  .riga { display:flex; gap:10px; } .riga > * { flex:1; }
  .pin { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .pin button { font-size:26px; font-weight:800; padding:16px 0; border-radius:16px; border:0; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .punti { display:flex; justify-content:center; gap:12px; margin:14px 0; }
  .punti i { width:16px; height:16px; border-radius:50%; background:#dfe0d2; } .punti i.on { background:var(--rosso); }
  label { display:block; font-size:12px; font-weight:800; color:var(--grigio); text-transform:uppercase; margin:10px 0 4px; }
  input, select { width:100%; font-size:17px; padding:12px; border-radius:12px; border:2px solid #e3e4da; background:#fff; font-family:inherit; }
  .toggle { display:flex; background:#eef0e4; border-radius:14px; padding:4px; }
  .toggle button { flex:1; border:0; background:transparent; padding:12px; border-radius:11px; font-weight:800; font-size:16px; color:var(--grigio); }
  .toggle button.on { background:#fff; color:var(--scuro); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .ordine { display:flex; gap:12px; align-items:center; padding:12px 0; border-top:1px solid #eef0e4; }
  .ordine:first-child { border-top:0; }
  .num { width:34px; height:34px; border-radius:50%; background:var(--rosso); color:#fff; display:grid; place-items:center; font-weight:900; flex:none; }
  .ordine .t { flex:1; } .ordine b { display:block; font-size:16px; }
  .x { border:0; background:#f3e2e1; color:var(--rosso); border-radius:10px; padding:8px 10px; font-weight:800; }
  .badge { display:inline-block; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:800; }
  .b-cont { background:#e3f4e8; color:var(--verde); } .b-sum { background:#e4ecfd; color:var(--blu); } .b-ora { background:#eef0b3; color:var(--scuro); }
  .wallet { background:var(--scuro); color:#fff; }
  .wallet .tot { display:flex; gap:10px; margin-top:10px; }
  .wallet .tot div { flex:1; background:rgba(255,255,255,.08); border-radius:14px; padding:12px; }
  .wallet .tot span { display:block; font-size:12px; font-weight:800; opacity:.7; text-transform:uppercase; }
  .wallet .tot b { font-size:24px; font-weight:900; }
  .wallet .tasca { margin-top:10px; background:var(--lime); color:var(--scuro); border-radius:14px; padding:10px 12px; font-weight:800; display:flex; justify-content:space-between; }
  .wallet details { margin-top:10px; font-size:14px; } .wallet summary { font-weight:800; opacity:.85; }
  .wallet .voce { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid rgba(255,255,255,.1); }
  .avv { background:#fff4e0; color:#8a5300; border-radius:12px; padding:10px 12px; font-size:14px; font-weight:600; margin-top:8px; }
  .err { background:#fde8e7; color:var(--rosso); }
  #mappa { position:fixed; top:calc(58px + env(safe-area-inset-top)); left:0; right:0; bottom:0; z-index:1; }
  .foglio { position:fixed; left:0; right:0; bottom:0; z-index:600; background:#fff; border-radius:24px 24px 0 0; padding:10px 16px calc(16px + env(safe-area-inset-bottom));
            box-shadow:0 -8px 30px rgba(0,0,0,.18); max-height:72vh; overflow:auto; }
  .maniglia { width:44px; height:5px; border-radius:3px; background:#dcdcd4; margin:0 auto 10px; }
  .tappa { font-size:13px; font-weight:800; color:var(--rosso); text-transform:uppercase; letter-spacing:.5px; }
  .cliente { font-size:24px; font-weight:900; margin:2px 0; }
  .via { font-size:17px; color:var(--scuro); }
  .incasso { margin:12px 0 4px; padding:14px; border-radius:16px; font-size:20px; font-weight:900; text-align:center; }
  .incasso.c { background:#e3f4e8; color:var(--verde); } .incasso.s { background:#e4ecfd; color:var(--blu); }
  .tempo { display:flex; justify-content:space-between; margin-top:8px; font-weight:700; }
  .icone { display:flex; gap:10px; margin-top:6px; } .icone a, .icone button { flex:1; text-align:center; text-decoration:none; }
  .banner { position:fixed; top:calc(66px + env(safe-area-inset-top)); left:10px; right:10px; z-index:560; background:var(--scuro); color:#fff; border-radius:18px; padding:12px 14px; display:flex; gap:12px; align-items:center; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .banner .fr { width:54px; height:54px; border-radius:14px; background:var(--lime); color:var(--scuro); display:grid; place-items:center; font-size:32px; font-weight:900; flex:none; }
  .banner .bt b { display:block; font-size:26px; font-weight:900; } .banner .bt span { font-size:16px; font-weight:600; opacity:.9; display:block; line-height:1.25; }
  .navbar { position:fixed; right:10px; top:calc(160px + env(safe-area-inset-top)); z-index:555; display:flex; flex-direction:column; gap:8px; }
  .navbar button { width:46px; height:46px; border-radius:50%; border:0; background:#fff; font-size:20px; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  .navbar button.on { background:var(--rosso); color:#fff; }
  .arrivo { position:fixed; left:10px; bottom:200px; z-index:555; background:#fff; border-radius:14px; padding:8px 12px; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  .arrivo b { display:block; font-size:20px; font-weight:900; color:var(--verde); } .arrivo span { font-size:12px; font-weight:700; color:var(--grigio); }
  .foglio.basso { max-height:40vh; padding-top:14px; } .foglio.evid { box-shadow:0 -8px 30px rgba(46,158,79,.55); }
  .riga1 { display:flex; gap:10px; align-items:center; } .riga1 > div:first-child { flex:1; min-width:0; }
  .riga1 .cliente { font-size:21px; } .riga1 .via { font-size:15px; color:var(--grigio); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { border-radius:16px; padding:8px 12px; text-align:center; min-width:96px; } .chip b { display:block; font-size:19px; } .chip small { font-weight:800; font-size:11px; text-transform:uppercase; }
  .chip.c { background:#e3f4e8; color:var(--verde); } .chip.s { background:#e4ecfd; color:var(--blu); }
  .btn.pic { flex:none !important; width:58px; padding:16px 0; text-align:center; text-decoration:none; color:var(--scuro); }
  .io-wrap { background:transparent; border:0; }
  .io { width:28px; height:28px; border-radius:50%; background:var(--blu); border:4px solid #fff; box-shadow:0 0 0 6px rgba(37,99,235,.25), 0 2px 6px rgba(0,0,0,.3); color:#fff; font-size:11px; display:grid; place-items:center; line-height:1; }
  #mappa.nav { top:58px; }
  .gps { position:fixed; top:66px; left:10px; z-index:550; background:#fff; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .attesa { position:fixed; inset:0; background:rgba(255,255,255,.85); z-index:2000; display:none; place-items:center; text-align:center; font-weight:800; }
  .attesa.on { display:grid; }
  .giro { width:46px; height:46px; border:5px solid var(--lime); border-top-color:var(--rosso); border-radius:50%; animation:g 0.9s linear infinite; margin:0 auto 12px; }
  @keyframes g { to { transform:rotate(360deg); } }
  .ok { font-size:56px; text-align:center; }
  .num-icon { background:var(--rosso); color:#fff; border:3px solid #fff; border-radius:50%; width:30px !important; height:30px !important; display:grid !important; place-items:center; font-weight:900; box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .casa-icon { background:var(--lime); border:3px solid #fff; border-radius:50%; width:30px !important; height:30px !important; display:grid !important; place-items:center; font-size:15px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
</style>
</head>

<script>
(function () {
"use strict";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const euro = v => (Number(v) || 0).toFixed(2).replace('.', ',') + ' €';
const hhmm = d => d ? new Date(d).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
const leggi = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const salva = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const togli = k => { try { localStorage.removeItem(k); } catch (e) {} };
function chiama(fn, ...a) {
  if (window.API_URL) return fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, a }) })
    .then(r => r.json()).then(j => { if (!j.ok) throw j.e; return j.r; }, () => { throw 'Connessione assente: riprova'; });
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e && e.message ? e.message : String(e)))[fn](...a));
}
function attesa(txt) { $('#attesaTxt').textContent = txt || 'Un attimo…'; $('#attesa').classList.toggle('on', !!txt); }
async function fai(txt, fn, ...a) {
  attesa(txt);
  try { S = await chiama(fn, PIN, ...a); attesa(); disegna(); return S; }
  catch (e) { attesa(); avviso(e); throw e; }
}
function avviso(e) { alert(String(e).replace(/^Error:\s*/, '')); }

let PIN = null, S = null, bozza = [], scheda = null, map = null, gpsWatch = null, ultimoInvio = 0, mioPunto = null, wake = null;

/* ---------- login ---------- */
function login() {
  fermaGps(); $('#chi').innerHTML = 'Rider<small>Amo la Pizza</small>'; $('#topbtn').innerHTML = '';
  let p = '';
  $('#app').innerHTML = `<div class="pag"><div class="card" style="text-align:center"><h2>Ciao! 🍕</h2><div class="muto">Scrivi il tuo PIN</div>
    <div class="punti">${'<i></i>'.repeat(4)}</div><div class="pin">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n => `<button ${n === '' ? 'style="visibility:hidden"' : ''}>${n}</button>`).join('')}</div></div></div>`;
  document.querySelectorAll('.pin button').forEach(b => b.onclick = async () => {
    const v = b.textContent; if (v === '⌫') p = p.slice(0, -1); else if (p.length < 4) p += v;
    document.querySelectorAll('.punti i').forEach((i, k) => i.classList.toggle('on', k < p.length));
    if (p.length === 4) {

      catch (e) { attesa(); avviso(e); p = ''; document.querySelectorAll('.punti i').forEach(i => i.classList.remove('on')); }

}

/* ---------- navigatore integrato ---------- */
let NAV = null, voce = true, ultimoRicalcolo = 0, fuoriStrada = 0, segnaposto = null, lineaNav = null, segue = true, chiedendo = false;
try { voce = leggi('voce') !== 'no'; } catch (e) {}

function parla(t) {
  if (!voce || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'it-IT'; u.rate = 1.05; speechSynthesis.speak(u); } catch (e) {}
}
const FRECCE = { 'turn-left': '⬅', 'turn-right': '➡', 'turn-slight-left': '↖', 'turn-slight-right': '↗', 'turn-sharp-left': '↙', 'turn-sharp-right': '↘',
  'uturn-left': '↶', 'uturn-right': '↷', 'roundabout-left': '⟲', 'roundabout-right': '⟳', 'keep-left': '↖', 'keep-right': '↗', 'fork-left': '↖', 'fork-right': '↗',
  'ramp-left': '↖', 'ramp-right': '↗', 'merge': '⬆', 'straight': '⬆' };
const freccia = m => FRECCE[m] || (/rotatoria/i.test(m) ? '⟳' : '⬆');
const metri = d => d >= 1000 ? (d / 1000).toFixed(1).replace('.', ',') + ' km' : (d < 50 ? Math.max(10, Math.round(d / 10) * 10) : Math.round(d / 50) * 50) + ' m';
const metriVoce = d => d >= 1000 ? (d / 1000).toFixed(1).replace('.', ',') + ' chilometri' : Math.round(d / 50) * 50 + ' metri';
function dist(a, b) {
  const r = Math.PI / 180, x = (b[1] - a[1]) * r * Math.cos((a[0] + b[0]) / 2 * r), y = (b[0] - a[0]) * r;
  return Math.sqrt(x * x + y * y) * 6371000;
}
function distLinea(p, linea) {
  let m = Infinity;
  for (let i = 0; i < linea.length - 1; i++) {
    const a = linea[i], b = linea[i + 1], k = Math.cos(p[0] * Math.PI / 180);
    const ax = a[1] * k, ay = a[0], bx = b[1] * k, by = b[0], px = p[1] * k, py = p[0];
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
    m = Math.min(m, dist(p, [ay + t * dy, (ax + t * dx) / k]));
  }
  return m;
}

function navigazione() {
  const c = S.consegne, prossima = c.filter(x => !x.consegnata)[0], fatte = c.filter(x => x.consegnata).length;
  const meta = prossima ? prossima.id : 'casa';
  if (!$('#mappa')) {
    $('#app').innerHTML = `<div id="mappa"></div>
      <div class="banner" id="banner"><div class="fr" id="fr">⬆</div><div class="bt"><b id="bdist">Calcolo il percorso…</b><span id="bistr"></span></div></div>
      <div class="navbar"><button id="voce">${voce ? '🔊' : '🔇'}</button><button id="centra">◎</button></div>
      <div class="arrivo" id="arrivo"></div><div class="foglio basso" id="foglio"></div>`;
    map = L.map('mappa', { zoomControl: false, attributionControl: false }).setView(S.casa, 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    map._livello = L.layerGroup().addTo(map);
    map.on('dragstart', () => { segue = false; $('#centra').classList.add('on'); });
    $('#centra').onclick = () => { segue = true; $('#centra').classList.remove('on'); map.setZoom(17); centra(); };
    $('#voce').onclick = () => { voce = !voce; salva('voce', voce ? 'si' : 'no'); $('#voce').textContent = voce ? '🔊' : '🔇'; if (voce) parla('Voce attiva'); };
  }
  disegnaTappe();
  const cont = prossima && prossima.pagamento === 'Contanti';
  $('#foglio').innerHTML = prossima ? `
      <div class="riga1"><div><div class="tappa">Consegna ${fatte + 1} di ${c.length}${prossima.previsto ? ' · per le ' + esc(prossima.previsto) : ''}</div>
        <div class="cliente">${esc(prossima.cliente || 'Cliente')}</div><div class="via">${esc(prossima.indirizzo.split(',')[0])}</div></div>
        <div class="chip ${cont ? 'c' : 's'}">${cont ? '💶' : '💳'}<b>${prossima.importo ? euro(prossima.importo) : ''}</b><small>${cont ? 'contanti' : 'SumUp'}</small></div></div>
      ${prossima.note ? `<div class="avv">📝 ${esc(prossima.note)}</div>` : ''}
      <div class="icone">${prossima.telefono ? `<a class="btn s pic" href="tel:${esc(prossima.telefono)}">📞</a>` : ''}
        <a class="btn s pic" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(prossima.indirizzo)}&travelmode=driving" target="_blank" style="font-size:13px;font-weight:900">Maps</a>
        <button class="btn v" id="fatto" style="flex:3">✓ Consegnato</button></div>`
    : `<div class="riga1"><div><div class="tappa">Tutto consegnato 🍕</div><div class="cliente">Rientro in pizzeria</div></div></div>
       <div class="icone"><a class="btn s pic" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(S.pizzeria)}&travelmode=driving" target="_blank" style="font-size:13px;font-weight:900">Maps</a>
       <button class="btn p" id="rientro" style="flex:3">🏠 Sono rientrato</button></div>`;
  if (prossima) $('#fatto').onclick = () => confirm('Consegnato a ' + (prossima.cliente || prossima.indirizzo) + (prossima.importo ? ' e incassato ' + euro(prossima.importo) + '?' : '?'))
    && fai('Salvo…', 'riderConsegnato', prossima.id);
  else $('#rientro').onclick = () => fai('Chiudo il giro…', 'riderRientrato');
  posizionaArrivo();
  if (!NAV || NAV.meta !== meta) { NAV = { meta, passi: null }; calcola(true); }
  else aggiornaNav();
  avviaGps();
}

async function calcola(nuova) {
  if (chiedendo) return; chiedendo = true; ultimoRicalcolo = Date.now();
  const meta = NAV.meta;
  try {
    const r = await chiama('riderIndicazioni', PIN, mioPunto ? mioPunto[0] : null, mioPunto ? mioPunto[1] : null);
    if (!NAV || NAV.meta !== meta) return;
    NAV = Object.assign(NAV, r, { linea: decodifica(r.linea), passo: 0, annunci: {}, arrivato: false, t0: Date.now() });
    if (lineaNav) lineaNav.remove();
    lineaNav = L.layerGroup([L.polyline(NAV.linea, { color: '#fff', weight: 11, opacity: .95 }), L.polyline(NAV.linea, { color: '#C6413C', weight: 7 })]).addTo(map);
    if (!mioPunto) map.fitBounds(NAV.linea, { paddingTopLeft: [20, 120], paddingBottomRight: [20, 200] });
    parla((nuova ? '' : 'Percorso ricalcolato. ') + NAV.passi[0].t + (NAV.passi.length > 1 ? '. Poi, ' + NAV.passi[1].t : ''));
    aggiornaNav();
  } catch (e) { $('#bdist').textContent = 'Percorso non disponibile'; $('#bistr').textContent = 'Usa il tasto G per Google Maps'; }
  finally { chiedendo = false; }
}

function aggiornaNav() {
  if (!NAV || !NAV.passi) return;
  const P = NAV.passi;
  if (mioPunto) {
    // avanza al passo giusto: il più vicino tra quello attuale e i prossimi due
    for (let k = NAV.passo; k < Math.min(P.length, NAV.passo + 3); k++) {
      if (dist(mioPunto, P[k].b) < 30 && k + 1 < P.length) NAV.passo = k + 1;
    }
    const fuori = distLinea(mioPunto, NAV.linea);
    fuoriStrada = fuori > 60 ? fuoriStrada + 1 : 0;
    if (fuoriStrada >= 2 && Date.now() - ultimoRicalcolo > 25000) { fuoriStrada = 0; calcola(false); }
    if (segue) centra();
  }
  const i = NAV.passo, p = P[i], prox = P[i + 1];
  const allaSvolta = mioPunto ? dist(mioPunto, p.b) : p.d;
  const resto = allaSvolta + P.slice(i + 1).reduce((a, x) => a + x.d, 0);
  const all = mioPunto ? dist(mioPunto, NAV.arrivo) : resto;
  if (all < 45 || (!prox && allaSvolta < 40)) {
    $('#fr').textContent = '🏁'; $('#bdist').textContent = 'Sei arrivato';
    $('#bistr').textContent = NAV.meta === 'casa' ? 'Amo la Pizza' : 'Consegna e premi Consegnato';
    if (!NAV.arrivato) { NAV.arrivato = true; parla('Sei arrivato a destinazione'); $('#foglio').classList.add('evid'); if (navigator.vibrate) navigator.vibrate(300); }
  } else {
    const istr = prox || p;
    $('#fr').textContent = freccia(istr.m);
    $('#bdist').textContent = prox ? 'Tra ' + metri(allaSvolta) : metri(allaSvolta);
    $('#bistr').textContent = istr.t;
    const k = i + ':' + (allaSvolta < 120 ? 'v' : allaSvolta < 450 ? 'l' : '');
    if (prox && mioPunto && k.slice(-1) && !NAV.annunci[k]) { NAV.annunci[k] = 1; parla((allaSvolta < 120 ? '' : 'Tra ' + metriVoce(allaSvolta) + ', ') + prox.t); }
  }
  const vel = NAV.dur && NAV.dist ? NAV.dist / NAV.dur : 8;
  $('#arrivo').innerHTML = `<b>${hhmm(Date.now() + resto / vel * 1000)}</b><span>${metri(resto)} · ${Math.max(1, Math.round(resto / vel / 60))} min</span>`;
}

function centra() {
  if (!mioPunto || !map) return;
  const f = $('#foglio') ? $('#foglio').offsetHeight : 0;
  map.setView(mioPunto, Math.max(map.getZoom(), 16), { animate: false });
  map.panBy([0, Math.round((f - 120) / 2)], { animate: false });
}
function posizionaArrivo() { const f = $('#foglio'), a = $('#arrivo'); if (f && a) a.style.bottom = (f.offsetHeight + 10) + 'px'; }
function decodifica(s) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < s.length) {
    let b, sh = 0, r = 0; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); lat += r & 1 ? ~(r >> 1) : r >> 1;
    sh = 0; r = 0; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); lng += r & 1 ? ~(r >> 1) : r >> 1;
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
function disegnaTappe() {
  const lv = map._livello; lv.clearLayers();
  L.marker(S.casa, { icon: L.divIcon({ className: 'casa-icon', html: '🍕', iconSize: [30, 30] }) }).addTo(lv);
  S.consegne.forEach((x, i) => {
    if (!x.lat) return;
    L.marker([x.lat, x.lng], { icon: L.divIcon({ className: 'num-icon', html: x.consegnata ? '✓' : String(i + 1), iconSize: [30, 30] }), opacity: x.consegnata ? .5 : 1 }).addTo(lv);
  });
}
function smontaMappa() { if (map) { map.remove(); map = null; } lineaNav = null; segnaposto = null; NAV = null; fermaGps(); }

/* ---------- GPS: solo durante il giro e solo con l'app aperta ---------- */
let prima = null;
function avviaGps() {
  if (gpsWatch !== null || !navigator.geolocation) return;
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {});
  gpsWatch = navigator.geolocation.watchPosition(p => {
    const nuovo = [p.coords.latitude, p.coords.longitude];
    const dir = p.coords.heading != null && !isNaN(p.coords.heading) ? p.coords.heading : (prima && dist(prima, nuovo) > 4 ? Math.atan2((nuovo[1] - prima[1]) * Math.cos(nuovo[0] * Math.PI / 180), nuovo[0] - prima[0]) * 180 / Math.PI : null);
    prima = nuovo; mioPunto = nuovo;
    if (map) {
      const html = `<div class="io" style="transform:rotate(${dir == null ? 0 : dir}deg)">${dir == null ? '' : '▲'}</div>`;
      if (!segnaposto) segnaposto = L.marker(mioPunto, { icon: L.divIcon({ className: 'io-wrap', html, iconSize: [28, 28] }), zIndexOffset: 2000 }).addTo(map);
      else { segnaposto.setLatLng(mioPunto); segnaposto.setIcon(L.divIcon({ className: 'io-wrap', html, iconSize: [28, 28] })); }
      if (NAV && !NAV.passi && !chiedendo) calcola(true); else aggiornaNav();
    }
    if (!S.gps || document.visibilityState !== 'visible' || Date.now() - ultimoInvio < S.gpsOgni * 1000) return;
    ultimoInvio = Date.now();
    chiama('riderPosizione', PIN, p.coords.latitude, p.coords.longitude, p.coords.accuracy).catch(() => {});
  }, err => { $('#bistr') && ($('#bistr').textContent = 'Attiva la posizione per il navigatore'); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function fermaGps() {
  if (gpsWatch !== null) { navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S && S.giro && S.giro.partenza) { fermaGps(); avviaGps(); }
});

/* ---------- foto: ridimensiona prima di inviare ---------- */
function comprimi(file, max) {
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ko; img.src = url;
  });
}

(async () => {
  const p = leggi('rider_pin'); if (!p) return login();
  try { attesa('Entro…'); S = await chiama('riderStato', p); PIN = p; attesa(); disegna(); } catch (e) { attesa(); togli('rider_pin'); login(); }
})();

})();
