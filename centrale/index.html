<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --lime:#CCD231; --rosso:#C6413C; --scuro:#302F31; --grigio:#7a7a7e; --sfondo:#f4f5ec; --verde:#2e9e4f; --blu:#2563eb; --arancio:#e07b00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--sfondo); color:var(--scuro); }
  header { background:var(--lime); padding:calc(10px + env(safe-area-inset-top)) 18px 10px; display:flex; align-items:center; gap:14px; }
  header img { height:44px; } header .t { flex:1; } header b { font-size:20px; font-weight:900; display:block; } header small { font-weight:700; opacity:.7; }
  header button { background:rgba(255,255,255,.6); border:0; border-radius:999px; padding:8px 14px; font-weight:800; }
  .kpi { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; max-width:1400px; margin:14px auto 0; padding:0 14px; }
  .kpi div { background:#fff; border-radius:16px; padding:12px 14px; box-shadow:0 3px 12px rgba(48,47,49,.06); }
  .kpi b { display:block; font-size:28px; font-weight:900; } .kpi span { font-size:12px; color:var(--grigio); font-weight:800; text-transform:uppercase; }
  main { padding:14px; max-width:1400px; margin:0 auto; display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:1000px) { main { grid-template-columns:1.35fr 1fr; } .kpi { grid-template-columns:repeat(5,1fr); } }
  @media (max-width:700px) { .kpi { grid-template-columns:repeat(2,1fr); } }
  .box { background:#fff; border-radius:20px; padding:16px; box-shadow:0 3px 12px rgba(48,47,49,.06); }
  .box h3 { margin:0 0 10px; font-size:15px; font-weight:900; text-transform:uppercase; letter-spacing:.4px; }
  #mappa { height:520px; border-radius:16px; }
  .rider { border:2px solid #eef0e4; border-radius:16px; padding:12px; margin-bottom:10px; }
  .rider.rit { border-color:var(--rosso); background:#fff7f6; }
  .rh { display:flex; align-items:center; gap:10px; }
  .pall { width:14px; height:14px; border-radius:50%; flex:none; }
  .rh b { font-size:18px; flex:1; } .stato { font-size:13px; font-weight:800; border-radius:999px; padding:3px 10px; background:#eef0b3; }
  .stop { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; padding:7px 0; border-top:1px dashed #e6e7dc; font-size:14px; }
  .n { width:24px; height:24px; border-radius:50%; background:var(--rosso); color:#fff; display:grid; place-items:center; font-weight:900; font-size:12px; }
  .n.ok { background:var(--verde); }
  .eta { text-align:right; font-weight:900; } .eta small { display:block; font-weight:600; color:var(--grigio); }
  .tardi { color:var(--rosso); } .inora { color:var(--verde); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th { text-align:left; color:var(--grigio); font-size:12px; text-transform:uppercase; padding:6px 4px; }
  td { padding:8px 4px; border-top:1px solid #eef0e4; } td.n2, th.n2 { text-align:right; }
  .voto { font-size:18px; font-weight:900; }
  .vuoto { color:var(--grigio); font-size:14px; padding:6px 0; }
  .pin { max-width:320px; margin:12vh auto; text-align:center; } .pin input { font-size:28px; text-align:center; width:100%; padding:14px; border-radius:16px; border:2px solid #e3e4da; letter-spacing:10px; }
  .pin button { margin-top:12px; width:100%; padding:16px; border:0; border-radius:16px; background:var(--rosso); color:#fff; font-size:18px; font-weight:900; }
  details.rep { border-top:1px solid #eef0e4; padding:8px 0; } details.rep pre { white-space:pre-wrap; font-family:inherit; font-size:13px; }
  .nome-tip { background:var(--scuro); color:#fff; border:0; font-weight:800; border-radius:8px; }
  .nome-tip:before { display:none; }
  .mk { background:transparent; border:0; }
  .mk div { width:100%; height:100%; border-radius:50%; border:3px solid #fff; color:#fff; display:grid; place-items:center; font-weight:900; font-size:12px; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .mk.casa div { background:var(--lime); font-size:18px; border-color:#fff; }
  .motivo { font-size:12px; font-weight:800; color:var(--rosso); margin-top:4px; }
  .leaflet-control-attribution { font-size:9px !important; opacity:.7; }
  .leaflet-control-attribution a[href*="leaflet"], .leaflet-attribution-flag { display:none !important; }
</style>

<div id="app"></div>
<script>
(function () {
"use strict";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const euro = v => (Number(v) || 0).toFixed(2).replace('.', ',') + ' €';
const hhmm = d => d ? new Date(d).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
const leggi = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const salva = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const togli = k => { try { localStorage.removeItem(k); } catch (e) {} };
const COLORI = ['#C6413C', '#2563eb', '#2e9e4f', '#e07b00', '#7c3aed', '#0891b2', '#db2777'];
const colore = n => COLORI[Math.abs([...n].reduce((a, c) => a + c.charCodeAt(0), 0)) % COLORI.length];
function chiama(fn, ...a) {
  if (window.API_URL) return fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, a }) })
    .then(r => r.json()).then(j => { if (!j.ok) throw j.e; return j.r; }, () => { throw 'Connessione assente: riprova'; });
  return new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ko(e && e.message ? e.message : String(e)))[fn](...a));
}

let PIN = null, map = null, livello = null, timer = null, primoFit = true, giriVisti = '';

function login() {
  $('#hb').innerHTML = '';
  $('#app').innerHTML = `<div class="pin"><h2>Centrale consegne</h2><input id="p" type="password" inputmode="numeric" maxlength="4" placeholder="PIN"><button id="go">Entra</button></div>`;
  const go = async () => { try { await chiama('hubDati', $('#p').value); PIN = $('#p').value; salva('hub_pin', PIN); avvia(); } catch (e) { alert(/PIN/.test(String(e)) ? 'PIN non valido' : String(e)); } };
  $('#go').onclick = go; $('#p').onkeyup = e => e.key === 'Enter' && go();
}

function avvia() {
  $('#hb').innerHTML = '<button id="esci">Esci</button>';
  $('#esci').onclick = () => { togli('hub_pin'); togli('hub_D'); clearInterval(timer); if (map) { map.remove(); map = null; } login(); };
  $('#app').innerHTML = `<div class="kpi">
      <div><span>Fuori adesso</span><b id="k1">-</b></div><div><span>Consegne oggi</span><b id="k2">-</b></div>
      <div><span>Media consegna</span><b id="k3">-</b></div><div><span>💶 Contanti incassati</span><b id="k4">-</b><small id="k4b" style="font-weight:800"></small></div><div><span>💳 SumUp</span><b id="k5">-</b></div></div>
    <main>
      <div><div class="box"><h3>🗺️ Dove sono</h3><div id="mappa"></div><div class="vuoto" id="gpsnota"></div></div>
        <div class="box" style="margin-top:14px"><h3>📊 Oggi per rider</h3><div id="stat"></div></div>
        <div class="box" style="margin-top:14px"><h3>⛽ Servizi e km</h3><div id="turni"></div></div></div>
      <div><div class="box"><h3>🛵 In consegna</h3><div id="attivi"></div></div>
        <div class="box" style="margin-top:14px"><h3>🏆 Pagella del mese</h3><div id="pagella"></div></div>
        <div class="box" style="margin-top:14px"><h3>📝 Report di fine servizio</h3><div id="report"></div></div></div>
    </main>`;
  map = L.map('mappa', { attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  livello = L.layerGroup().addTo(map);
  primoFit = true; aggiorna(true); aggiorna(); clearInterval(timer); timer = setInterval(() => aggiorna(), 15000);
}

function decodifica(s) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < s.length) {
    let b, sh = 0, r = 0; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); lat += r & 1 ? ~(r >> 1) : r >> 1;
    sh = 0; r = 0; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32); lng += r & 1 ? ~(r >> 1) : r >> 1;
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
const minDa = d => Math.round((Date.now() - new Date(d)) / 60000);
function ritardoSuOrario(eta, previsto) {
  if (!eta || !/^\d{1,2}:\d{2}$/.test(previsto || '')) return null;
  const e = new Date(eta), [h, m] = previsto.split(':').map(Number);
  return (e.getHours() * 60 + e.getMinutes()) - (h * 60 + m);
}

async function aggiorna(daMemoria) {
  let d;
  if (daMemoria) { try { d = JSON.parse(localStorage.getItem('hub_D') || 'null'); } catch (e) {} if (!d) return; }
  else { try { d = await chiama('hubDati', PIN); } catch (e) { return; } try { localStorage.setItem('hub_D', JSON.stringify(d)); } catch (e) {} }
  $('#sotto').textContent = 'Aggiornato alle ' + hhmm(d.ora) + ' · ' + d.chi;
  const tot = d.stat.reduce((a, s) => a + s.consegne, 0), min = d.stat.reduce((a, s) => a + s.minuti, 0);
  $('#k1').textContent = d.attivi.filter(g => g.partenza).length;
  $('#k2').textContent = tot;
  $('#k3').textContent = tot ? Math.round(min / tot) + "'" : '-';
  $('#k4').textContent = euro(d.stat.reduce((a, s) => a + s.contanti, 0));
  const tasca = d.stat.reduce((a, s) => a + (s.inTasca || 0), 0);
  $('#k4b').innerHTML = tasca > 0 ? `<span class="tardi">${euro(tasca)} ancora ai rider</span>` : (d.stat.length ? '<span class="inora">tutti in cassa ✓</span>' : '');
  $('#k5').textContent = euro(d.stat.reduce((a, s) => a + s.pos, 0));
  $('#gpsnota').textContent = d.gps ? 'Posizione dal vivo solo durante i giri, con l\'app del rider aperta.' : 'GPS spento: orari stimati con Google Maps.';

  $('#attivi').innerHTML = d.attivi.length ? d.attivi.map(g => {
    const tardi = g.consegne.some(c => !c.consegnata && (ritardoSuOrario(c.etaOra, c.previsto) || 0) > d.tolleranza) || g.inRitardo;
    return `<div class="rider ${tardi ? 'rit' : ''}"><div class="rh"><span class="pall" style="background:${colore(g.rider)}"></span><b>${esc(g.rider)}</b>
      <span class="stato">${g.partenza ? (g.stato === 'Rientro' ? '🏠 Rientra' : '🛵 Fuori da ' + minDa(g.partenza) + "'") : '📦 Prepara il giro'}</span></div>
      ${g.inRitardo ? `<div class="motivo">⚠️ Più lento di Google di ${g.ritardo}' sulla tratta in corso</div>` : tardi ? '<div class="motivo">⚠️ Arriverà dopo l\'orario promesso al cliente</div>' : ''}
      ${g.consegne.map((c, i) => {
        const r = c.consegnata ? null : ritardoSuOrario(c.etaOra, c.previsto);
        return `<div class="stop"><span class="n ${c.consegnata ? 'ok' : ''}" style="${c.consegnata ? '' : 'background:' + colore(g.rider)}">${c.consegnata ? '✓' : i + 1}</span>
          <div><b>${esc(c.cliente || c.indirizzo.split(',')[0])}</b> <span style="color:var(--grigio)">${esc(c.indirizzo.split(',')[0])}</span><br>
          <small>${c.previsto ? '⏰ per le ' + esc(c.previsto) + ' · ' : ''}${c.pagamento === 'Contanti' ? '💶' : '💳'} ${c.importo ? euro(c.importo) : ''}</small>
          ${c.avvisi ? `<br><small class="tardi">⚠️ ${esc(c.avvisi)}</small>` : ''}</div>
          <div class="eta ${c.consegnata ? 'inora' : r !== null && r > d.tolleranza ? 'tardi' : ''}">${c.consegnata ? hhmm(c.consegnata) + '<small>consegnato</small>'
            : c.etaOra ? hhmm(c.etaOra) + `<small>${r === null ? 'arrivo previsto' : r > 0 ? '+' + r + "' sull'orario" : 'in orario'}</small>` : '-'}</div></div>`;
      }).join('')}
      ${g.partenza && g.rientro ? `<div class="stop"><span class="n" style="background:var(--lime);color:var(--scuro)">🍕</span><div><b>Rientro in pizzeria</b></div><div class="eta">${hhmm(g.rientro)}<small>previsto</small></div></div>` : ''}
      ${g.pos ? `<div class="vuoto">📍 posizione delle ${hhmm(g.pos.ora)}</div>` : ''}</div>`;
  }).join('') : '<div class="vuoto">Nessun rider in giro adesso.</div>';

  $('#stat').innerHTML = d.stat.length ? `<table><tr><th>Rider</th><th class="n2">Consegne</th><th class="n2">Media</th><th class="n2">Giro medio</th><th class="n2">💶 Contanti</th><th class="n2">In tasca</th><th class="n2">💳 SumUp</th><th class="n2">Avvisi</th></tr>
    ${d.stat.map(s => `<tr><td><span class="pall" style="display:inline-block;background:${colore(s.rider)}"></span> ${esc(s.rider)}</td><td class="n2">${s.consegne}</td>
      <td class="n2">${s.consegne ? Math.round(s.minuti / s.consegne) + "'" : '-'}</td><td class="n2">${s.giri ? Math.round(s.minGiro / s.giri) + "'" : '-'}</td>
      <td class="n2">${euro(s.contanti)}</td><td class="n2 ${s.inTasca > 0 ? 'tardi' : 'inora'}">${s.inTasca > 0 ? euro(s.inTasca) : (s.contanti ? '✓ in cassa' : '-')}</td><td class="n2">${euro(s.pos)}</td><td class="n2 ${s.avvisi ? 'tardi' : ''}">${s.avvisi}</td></tr>`).join('')}</table>`
    : '<div class="vuoto">Ancora nessuna consegna oggi.</div>';

  const pc = v => `<td class="n2 ${v >= 90 ? 'inora' : v < 75 ? 'tardi' : ''}">${v}%</td>`, med = ['🥇', '🥈', '🥉'];
  $('#pagella').innerHTML = d.classifica.length ? `<table><tr><th></th><th>Rider</th><th class="n2">Voto</th><th class="n2">Percorso</th><th class="n2">Puntuale</th><th class="n2">Tempi</th><th class="n2">Rientri</th></tr>
    ${d.classifica.map((x, i) => `<tr style="opacity:${x.inGara ? 1 : .5}"><td>${x.inGara ? (med[i] || i + 1) : '–'}</td><td>${esc(x.rider)}<br><small style="color:var(--grigio)">${x.consegne} consegne · ${x.km} km</small></td>
      <td class="n2 voto">${x.voto}</td>${pc(x.percorso)}${pc(x.puntualita)}${pc(x.tempi)}${pc(x.rientro)}</tr>`).join('')}</table>
    <div class="vuoto">Voto su 10: 30% percorso consigliato · 30% puntualità sull'orario · 25% tempi Google · 15% rientri</div>`
    : '<div class="vuoto">Nessun dato questo mese.</div>';

  $('#turni').innerHTML = d.turni.length ? `<table><tr><th>Rider</th><th>Dalle</th><th>Alle</th><th class="n2">Km</th><th class="n2">Google</th><th></th></tr>
    ${d.turni.map(t => `<tr><td>${esc(t.rider)}</td><td>${hhmm(t.inizio)}</td><td>${t.fine ? hhmm(t.fine) : '<i>in servizio</i>'}</td>
      <td class="n2">${t.km !== '' ? t.km : '-'}</td><td class="n2">${t.kmG !== '' ? t.kmG : '-'}</td><td>${t.foto ? `<a href="${esc(t.foto)}" target="_blank">foto</a>` : ''}</td></tr>
      ${t.avvisi ? `<tr><td colspan="6" class="tardi" style="font-size:13px">⚠️ ${esc(t.avvisi)}</td></tr>` : ''}`).join('')}</table>`
    : '<div class="vuoto">Nessun servizio iniziato oggi.</div>';

  $('#report').innerHTML = d.report.length ? d.report.map(r => `<details class="rep"><summary>${r.avvisi ? '⚠️' : '✅'} ${esc(r.servizio)} ${esc(r.data)} · ${r.consegne} consegne · ${r.avvisi} avvisi</summary><pre>${esc(r.testo)}</pre></details>`).join('')
    : '<div class="vuoto">Il primo report arriva alle 14:30 o alle 22:30.</div>';

  // mappa
  livello.clearLayers();
  const punti = [d.casa];
  L.marker(d.casa, { icon: L.divIcon({ className: 'mk casa', html: '<div>🍕</div>', iconSize: [38, 38] }), zIndexOffset: 1000 }).addTo(livello).bindTooltip('Amo la Pizza', { className: 'nome-tip' });
  d.attivi.filter(g => g.partenza).forEach(g => {
    const col = colore(g.rider);
    if (g.percorso) { const l = decodifica(g.percorso); L.polyline(l, { color: col, weight: 5, opacity: .75 }).addTo(livello); l.forEach(p => punti.push(p)); }
    g.consegne.forEach((c, i) => {
      if (!c.lat) return;
      L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'mk', html: `<div style="background:${c.consegnata ? '#2e9e4f' : col}">${c.consegnata ? '✓' : i + 1}</div>`, iconSize: [26, 26] }), opacity: c.consegnata ? .6 : 1 })
        .addTo(livello).bindTooltip(esc(g.rider) + ' · ' + esc(c.cliente || c.indirizzo.split(',')[0]) + (c.etaOra && !c.consegnata ? ' · arrivo ' + hhmm(c.etaOra) : ''));
    });
    if (g.pos) {
      L.circleMarker([g.pos.lat, g.pos.lng], { radius: 11, color: '#fff', weight: 3, fillColor: col, fillOpacity: 1 }).addTo(livello)
        .bindTooltip(esc(g.rider) + ' · ' + hhmm(g.pos.ora), { permanent: true, direction: 'top', className: 'nome-tip' });
      punti.push([g.pos.lat, g.pos.lng]);
    }
  });
  const chiave = d.attivi.filter(g => g.partenza).map(g => g.rider + g.partenza).join('|');
  if (primoFit || chiave !== giriVisti) { giriVisti = chiave; punti.length > 1 ? map.fitBounds(punti, { padding: [30, 30], maxZoom: 15 }) : map.setView(d.casa, 13); primoFit = false; }
}

const p = leggi('hub_pin'); if (p) { PIN = p; avvia(); } else login();

})();
</script>
</body>
</html>
